services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: white_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d white_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ./apps/backend
    env_file:
      - .env.backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/white_local?ssl=false&sslmode=disable
      REDIS_URL: redis://redis:6379
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000,http://localhost:3000
      AUTH_CORS: http://localhost:3000
      JWT_SECRET: local-jwt-secret
      COOKIE_SECRET: local-cookie-secret
      STORE_NAME: White Shop
      PRIMARY_COLOR: "#111111"
      LOGO_URL: ""
      STORE_FONT: Inter
      DEFAULT_LANGUAGE: fr
      SUPPORTED_LANGUAGES: fr,en
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    env_file:
      - .env.storefront
    environment:
      MEDUSA_BACKEND_URL: http://backend:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_5c328ce90bc55ba4df7101f655c08b7e4b870875051600e69ef40f671bcab75b
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
