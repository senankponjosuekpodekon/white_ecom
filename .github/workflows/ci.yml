name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build backend
        run: npm run build -w @dtc/backend

      - name: Build storefront
        run: npm run build -w @dtc/storefront

      - name: Run unit tests
        run: npm run test:unit -w @dtc/backend

      - name: Audit dependencies
        run: npm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Create env files for compose
        run: |
          printf 'STRIPE_API_KEY=sk_test_placeholder\nSTRIPE_WEBHOOK_SECRET=whsec_placeholder\n' > .env.backend
          touch .env.storefront

      - name: Start postgres, redis and backend
        run: docker compose up -d --build postgres redis backend

      - name: Extract publishable key
        id: pkey
        run: |
          for i in $(seq 1 60); do
            KEY=$(docker compose logs backend 2>/dev/null | grep -o 'PUBLISHABLE_KEY=pk_[a-f0-9]*' | tail -1 | cut -d= -f2)
            if [ -n "$KEY" ]; then
              echo "key=$KEY" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Build storefront with publishable key
        run: docker compose build storefront
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ steps.pkey.outputs.key }}

      - name: Start storefront
        run: docker compose up -d storefront

      - name: Wait for storefront
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/fr >/dev/null 2>&1; then
              exit 0
            fi
            if [ $((i % 4)) -eq 0 ]; then
              docker compose logs backend --tail 40 || true
            fi
            sleep 5
          done
          exit 1

      - name: Install dependencies for E2E
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/storefront
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: make test-e2e
