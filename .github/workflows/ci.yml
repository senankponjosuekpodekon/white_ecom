name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build backend
        run: npm run build -w @dtc/backend

      - name: Build storefront
        run: npm run build -w @dtc/storefront

      - name: Run unit tests
        run: npm run test:unit -w @dtc/backend

      - name: Audit dependencies
        run: npm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Create env files for compose
        run: |
          printf 'STRIPE_API_KEY=sk_test_placeholder\nSTRIPE_WEBHOOK_SECRET=whsec_placeholder\n' > .env.backend
          touch .env.storefront

      - name: Build and start stack
        run: |
          docker compose up -d --build || true
          sleep 20
          docker compose ps
          docker compose logs backend --tail 80 || true

      - name: Wait for storefront
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/fr >/dev/null 2>&1; then
              exit 0
            fi
            if [ $((i % 4)) -eq 0 ]; then
              docker compose logs backend --tail 40 || true
            fi
            sleep 5
          done
          exit 1

      - name: Run E2E tests
        run: make test-e2e
