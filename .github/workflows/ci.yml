name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build backend
        run: npm run build -w @dtc/backend

      - name: Build storefront
        run: npm run build -w @dtc/storefront

      - name: Run unit tests
        run: npm run test:unit -w @dtc/backend

      - name: Audit dependencies
        run: npm audit --audit-level high
