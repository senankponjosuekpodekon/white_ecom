name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build backend
        run: npm run build -w @dtc/backend

      - name: Build storefront
        run: npm run build -w @dtc/storefront

      - name: Run unit tests
        run: npm run test:unit -w @dtc/backend

      - name: Audit dependencies
        run: npm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Create env file for compose
        run: |
          cat > .env <<'EOF'
          # --- Infra ---
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/white_local?sslmode=disable
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci_jwt_secret
          COOKIE_SECRET=ci_cookie_secret
          COOKIE_SECURE=false
          COOKIE_SAME_SITE=lax
          COOKIE_HTTP_ONLY=true
          COOKIE_MAX_AGE=604800000
          SESSION_COOKIE_NAME=connect.sid
          NODE_ENV=development
          PORT=9000

          # --- CORS ---
          STORE_CORS=http://localhost:3000,http://localhost:8080
          ADMIN_CORS=http://localhost:9000,http://localhost:3000,http://localhost:8080
          AUTH_CORS=http://localhost:3000,http://localhost:8080

          # --- White-label store ---
          CLIENT_NAME=default
          STORE_NAME=White Shop
          PRIMARY_COLOR=#3B82F6
          LOGO_URL=
          STORE_FONT=Inter
          DEFAULT_LANGUAGE=fr
          SUPPORTED_LANGUAGES=fr,en
          DESIGN_PRESET=modern
          SITE_URL=http://localhost:8080

          # --- Stripe ---
          STRIPE_API_KEY=sk_test_placeholder
          STRIPE_WEBHOOK_SECRET=whsec_placeholder
          NEXT_PUBLIC_STRIPE_KEY=pk_test_placeholder

          # --- Demo accounts ---
          CREATE_DEFAULT_ADMIN=true
          SUPER_ADMIN_EMAIL=super@example.com
          SUPER_ADMIN_PASSWORD=superpassword
          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=password
          MANAGER_EMAIL=manager@example.com
          MANAGER_PASSWORD=managerpassword
          DEMO_CUSTOMER_EMAIL=customer@example.com
          DEMO_CUSTOMER_PASSWORD=password

          # --- Storefront ---
          MEDUSA_BACKEND_URL=http://backend:9000
          NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_5c328ce90bc55ba4df7101f655c08b7e4b870875051600e69ef40f671bcab75b
          NEXT_PUBLIC_SITE_URL=http://localhost:8080
          EOF

      - name: Start postgres, redis and backend
        run: docker compose up -d --build postgres redis backend

      - name: Extract publishable key
        id: pkey
        run: |
          for i in $(seq 1 60); do
            KEY=$(docker compose logs backend 2>/dev/null | grep -o 'PUBLISHABLE_KEY=pk_[a-f0-9]*' | tail -1 | cut -d= -f2)
            if [ -n "$KEY" ]; then
              echo "key=$KEY" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Build storefront with publishable key
        run: docker compose build storefront
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ steps.pkey.outputs.key }}

      - name: Start storefront
        run: docker compose up -d storefront

      - name: Wait for storefront
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/fr || true)
            if [ "$status" = "200" ]; then
              echo "Storefront is ready (HTTP 200)."
              exit 0
            fi
            echo "Storefront not ready yet (HTTP ${status:-none}). Retrying... ($i/60)"
            if [ $((i % 4)) -eq 0 ]; then
              echo "--- backend logs ---"
              docker compose logs backend --tail 40 || true
              echo "--- storefront logs ---"
              docker compose logs storefront --tail 40 || true
            fi
            sleep 5
          done
          echo "--- final storefront logs ---"
          docker compose logs storefront --tail 80 || true
          exit 1

      - name: Install dependencies for E2E
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/storefront
        run: |
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/microsoft-edge*.list || true
          sudo apt-get clean
          sudo apt-get update -y
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: make test-e2e
