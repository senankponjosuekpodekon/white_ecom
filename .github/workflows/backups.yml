name: Client backups

# Render/Vercel topology: no VPS. The backend Postgres lives on Render and
# exposes an external connection string (Render dashboard → Postgres →
# Connections → External). This workflow dumps it and uploads to S3.
#
# Secrets required:
#   BACKUP_DATABASE_URL   — postgres://... (Render external URL)
#   S3_BUCKET             — target bucket (optional; dump verified only if unset)
#   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
# Vars:  S3_REGION, S3_ENDPOINT (custom endpoint, optional), BACKUP_PREFIX

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
    steps:
      - name: Skip if not configured
        if: ${{ env.BACKUP_DATABASE_URL == '' }}
        run: |
          echo "BACKUP_DATABASE_URL secret manquant — backup ignoré"
          exit 0

      - name: Dump Postgres
        run: |
          set -euo pipefail
          FILE="backup-$(date +%Y-%m-%d-%H%M%S).sql.gz"
          pg_dump "$BACKUP_DATABASE_URL" --no-owner --no-privileges | gzip > "$FILE"
          if [ ! -s "$FILE" ] || [ "$(stat -c%s "$FILE")" -lt 1024 ]; then
            echo "Dump anormalement petit — échec"
            exit 1
          fi
          echo "Dump OK: $(stat -c%s "$FILE") bytes"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"
        # pg_dump via postgres client image is unnecessary — ubuntu-latest ships it.

      - name: Upload to S3
        if: ${{ env.S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.S3_REGION }}

      - name: Push dump
        if: ${{ env.S3_BUCKET != '' }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://$S3_BUCKET/$BACKUP_PREFIX/$BACKUP_FILE" ${S3_ENDPOINT:+--endpoint-url "$S3_ENDPOINT"}
          echo "Uploaded to s3://$S3_BUCKET/$BACKUP_PREFIX/$BACKUP_FILE"
        env:
          BACKUP_PREFIX: ${{ vars.BACKUP_PREFIX || 'white-main' }}

      - name: Prune old backups (keep 30)
        if: ${{ env.S3_BUCKET != '' }}
        run: |
          aws s3 ls "s3://$S3_BUCKET/$BACKUP_PREFIX/" ${S3_ENDPOINT:+--endpoint-url "$S3_ENDPOINT"} \
            | sort | head -n -30 | awk '{print $4}' \
            | while read -r f; do
                aws s3 rm "s3://$S3_BUCKET/$BACKUP_PREFIX/$f" ${S3_ENDPOINT:+--endpoint-url "$S3_ENDPOINT"}
              done
        env:
          BACKUP_PREFIX: ${{ vars.BACKUP_PREFIX || 'white-main' }}
