name: Uptime check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check storefront
        if: ${{ vars.PROD_SITE_URL != '' }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${{ vars.PROD_SITE_URL }}/fr")
          if [ "$code" != "200" ]; then
            echo "::error::Storefront ${PROD_SITE_URL:-} returned $code"
            exit 1
          fi
          echo "Storefront OK ($code)"

      - name: Check backend health
        if: ${{ vars.PROD_API_URL != '' }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${{ vars.PROD_API_URL }}/health")
          if [ "$code" != "200" ]; then
            echo "::error::Backend ${PROD_API_URL:-} health returned $code"
            exit 1
          fi
          echo "Backend OK ($code)"

      - name: Skip notice
        if: ${{ vars.PROD_SITE_URL == '' && vars.PROD_API_URL == '' }}
        run: echo "PROD_SITE_URL / PROD_API_URL non définies (repo variables) — checks ignorés"

      - name: Alert via Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL non défini — alerte Slack ignorée"
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"🚨 Uptime check FAILED on ${{ github.repository }} (${{ github.ref_name }}) — run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Alert via email (Resend)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL" ]; then
            echo "RESEND_API_KEY / ALERT_EMAIL non définis — alerte email ignorée"
            exit 0
          fi
          FROM="${ALERT_FROM:-uptime@stiamond.com}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"$FROM\",
              \"to\": [\"$ALERT_EMAIL\"],
              \"subject\": \"Uptime check failed — ${{ github.repository }}\",
              \"text\": \"A health check failed on branch ${{ github.ref_name }}.\n\nRun: $RUN_URL\n\nChecked URLs: storefront=${{ vars.PROD_SITE_URL }}, backend=${{ vars.PROD_API_URL }}\"
            }"
