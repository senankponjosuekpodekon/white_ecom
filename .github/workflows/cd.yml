name: CD

on:
  push:
    branches: [main, dev]
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  STOREFRONT_IMAGE: ghcr.io/${{ github.repository }}/storefront

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY || 'pk_5c328ce90bc55ba4df7101f655c08b7e4b870875051600e69ef40f671bcab75b' }}
      SITE_URL: ${{ secrets.SITE_URL || 'http://localhost:8080' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.BACKEND_IMAGE }}
            ${{ env.STOREFRONT_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Set image tags
        id: imagetags
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "backend=${{ env.BACKEND_IMAGE }}:dev,${{ env.BACKEND_IMAGE }}:latest" >> "$GITHUB_OUTPUT"
            echo "storefront=${{ env.STOREFRONT_IMAGE }}:dev,${{ env.STOREFRONT_IMAGE }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "storefront=${{ env.STOREFRONT_IMAGE }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.imagetags.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push storefront
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/storefront/Dockerfile
          push: true
          tags: ${{ steps.imagetags.outputs.storefront }}
          build-args: |
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

    steps:
      - name: Trigger Render backend deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set, skipping Render deploy."
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK"

      - name: Trigger Vercel storefront deploy
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK not set, skipping Vercel deploy."
            exit 0
          fi
          curl -X POST "$VERCEL_DEPLOY_HOOK"
